name: Schedule probe

# TEMPORARY DIAGNOSTIC - delete once the tournament schedule is confirmed firing.
#
# The tournament workflow has never once been triggered by its cron, on the old fork or on this
# repo, while reading `active` with Actions fully enabled and GitHub Actions reporting
# operational. Two explanations were plausible and I could not tell them apart from the outside:
# GitHub is not scheduling anything for this account, or the tournament workflow specifically has
# something wrong with it.
#
# This separates them. It runs every 5 minutes (the shortest interval GitHub accepts), does no
# work, spends nothing, and pushes no commits. If this fires and the tournament workflow does not,
# the problem is in that workflow. If neither fires, scheduling is not working here at all and the
# bot needs a trigger that does not depend on GitHub's scheduler.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record that a scheduled run happened
        run: |
          echo "triggered by: ${{ github.event_name }}"
          date -u +"%Y-%m-%dT%H:%M:%SZ"
