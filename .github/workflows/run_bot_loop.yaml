name: Forecast in a loop (scheduler-independent)

# Insurance against GitHub's scheduler, which does not run for this account at all. A workflow
# that did nothing but exist on a */5 cron missed six consecutive ticks, so this is not the fork
# restriction and not a fault in the tournament workflow - scheduled events simply never arrive.
#
# That matters more than it sounds. Tournament questions open and close inside a MEDIAN OF 2.4
# HOURS, an unforecast question scores exactly zero, and prize share goes as the square of summed
# peer score. A bot that only runs when somebody presses a button scores nothing on most of a
# season.
#
# GitHub caps a JOB at six hours but a workflow RUN at 35 days, so four jobs chained with `needs`
# give roughly 22 hours of continuous forecasting from a single dispatch. One press a day, no
# personal access token, no external host, no dependency on `schedule`.
#
# Deliberately not scheduled itself - that would reintroduce exactly the thing it works around.
# The concurrency group stops two dispatches overlapping and double-spending.
#
# Cost is bounded by the tournament rather than by this loop: the bot skips questions it has
# already forecast, so a pass with nothing newly open costs one Metaculus API call and no LLM
# calls at all.
#
# A cleaner version exists if a fine-grained PAT with Actions:write is ever added as
# secrets.LOOP_PAT - the last leg could re-dispatch the workflow and run indefinitely. The default
# GITHUB_TOKEN cannot do this: GitHub blocks it from triggering workflows, to prevent recursion.
on:
  workflow_dispatch:
    inputs:
      hours_per_leg:
        description: "Hours each leg forecasts for (max 5.5; GitHub kills a job at 6)"
        required: false
        default: "5.5"
      interval_minutes:
        description: "Minutes to wait between passes"
        required: false
        default: "20"

concurrency:
  group: forecast-loop
  cancel-in-progress: false

jobs:
  leg1:
    uses: ./.github/workflows/forecast-leg.yaml
    with:
      hours: ${{ inputs.hours_per_leg }}
      interval_minutes: ${{ inputs.interval_minutes }}
      leg: 1
    secrets: inherit

  leg2:
    needs: leg1
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/forecast-leg.yaml
    with:
      hours: ${{ inputs.hours_per_leg }}
      interval_minutes: ${{ inputs.interval_minutes }}
      leg: 2
    secrets: inherit

  leg3:
    needs: leg2
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/forecast-leg.yaml
    with:
      hours: ${{ inputs.hours_per_leg }}
      interval_minutes: ${{ inputs.interval_minutes }}
      leg: 3
    secrets: inherit

  leg4:
    needs: leg3
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/forecast-leg.yaml
    with:
      hours: ${{ inputs.hours_per_leg }}
      interval_minutes: ${{ inputs.interval_minutes }}
      leg: 4
    secrets: inherit
