name: Forecast leg

# One leg of the scheduler-independent loop. Called only by run_bot_loop.yaml, which chains four
# of these to turn GitHub's six-hour-per-JOB cap into roughly a day of continuous coverage from a
# single dispatch. Kept as a reusable workflow so the loop body exists once rather than being
# copy-pasted per leg and drifting.
on:
  workflow_call:
    inputs:
      hours:
        type: string
        required: true
      interval_minutes:
        type: string
        required: true
      leg:
        type: number
        required: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Forecast until this leg's time is up
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          set -u
          deadline=$(( $(date +%s) + $(python -c "print(int(float('${{ inputs.hours }}') * 3600))") ))
          interval=$(( ${{ inputs.interval_minutes }} * 60 ))
          pass=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            pass=$((pass + 1))
            echo "::group::leg ${{ inputs.leg }} pass $pass at $(date -u +%H:%M:%S)"
            # A failing pass must not end the leg - one bad question or a provider blip should
            # cost that pass, not the remaining hours of coverage.
            poetry run python main.py || echo "leg ${{ inputs.leg }} pass $pass exited non-zero, continuing"
            echo "::endgroup::"
            remaining=$(( deadline - $(date +%s) ))
            if [ "$remaining" -le "$interval" ]; then
              echo "leg ${{ inputs.leg }} finished after $pass passes"
              break
            fi
            sleep "$interval"
          done
